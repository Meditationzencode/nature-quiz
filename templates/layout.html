<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nature Quiz — answer 10 random questions about birds, trees, insects, and animals across three difficulty levels, then climb the leaderboard.">
    <meta name="theme-color" content="#2f6f45">
    <title>{% block title %}Nature Quiz{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='main.js') }}" defer></script>
</head>
<body>
    <div class="page-overlay">
        <main class="card">
            {% block content %}{% endblock %}
        </main>
        <footer class="site-footer">
            Built with Python and Flask &middot; <a href="https://github.com/Meditationzencode/nature-quiz" target="_blank" rel="noopener noreferrer">View Source Code on GitHub</a>
        </footer>
    </div>
</body>
</html>
